<style>
  :root { --c:#124453; --bg:#f4f6f7; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; background:var(--bg); color:#1c1c1e; }
  header { position:sticky; top:0; z-index:2; background:#fff; border-bottom:1px solid #e5e5ea; padding:16px 20px; }
  header h1 { margin:0; font-size:18px; color:var(--c); }
  header p { margin:6px 0 0; font-size:13px; color:#636366; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:14px; padding:16px 20px 40px; }
  .card { margin:0; background:#fff; border:1px solid #e5e5ea; border-radius:16px; overflow:hidden; position:relative; }
  .num { position:absolute; top:10px; left:10px; background:var(--c); color:#fff; font-weight:700; font-size:14px; width:32px; height:32px; border-radius:10px; display:flex; align-items:center; justify-content:center; }
  img { display:block; width:100%; height:180px; object-fit:cover; background:#eee; }
  figcaption { padding:10px 12px 14px; font-size:12px; line-height:1.35; }
  figcaption span { color:#8e8e93; }
</style>
</head>
