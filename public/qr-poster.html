<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hotel Canal — A4 QR Poster</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    @page {
      size: A4;
      margin: 0;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: #E8EEF0;
      -webkit-print-color-adjust: exact;
      print-color-adjust: exact;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Montserrat, -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    .poster-wrapper {
      width: 210mm;
      height: 297mm;
      box-sizing: border-box;
      padding: 30mm 24mm 22mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      background: #FFFFFF;
      position: relative;
      overflow: hidden;
      box-shadow: 0 18px 48px rgba(18, 68, 83, 0.12);
    }

    .watermark {
      position: absolute;
      left: 50%;
      bottom: 42mm;
      width: 120mm;
      height: 48mm;
      transform: translateX(-50%);
      opacity: 0.045;
      pointer-events: none;
      color: #124453;
    }

    .brand-section {
      text-align: center;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    .hotel-title {
      font-family: Cinzel, Georgia, serif;
      font-size: 38px;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: #124453;
      text-transform: uppercase;
      margin: 0;
      line-height: 1.1;
    }

    .hotel-subtitle {
      font-family: Cinzel, Georgia, serif;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.3em;
      color: #C5A059;
      margin: 12px 0 0;
    }

    .cta-section {
      text-align: center;
      max-width: 140mm;
      margin-top: 8mm;
      position: relative;
      z-index: 1;
    }

    .main-claim {
      font-family: Cinzel, Georgia, serif;
      font-size: 24px;
      font-weight: 600;
      color: #124453;
      line-height: 1.35;
      margin: 0 0 14px;
      letter-spacing: 0.02em;
    }

    .sub-claim {
      font-family: Montserrat, sans-serif;
      font-size: 13.5px;
      line-height: 1.65;
      color: #515154;
      font-weight: 500;
      margin: 0;
    }

    .qr-display-box {
      text-align: center;
      margin: 10mm 0 6mm;
      position: relative;
      z-index: 1;
    }

    .qr-plate {
      background: #FFFFFF;
      padding: 18px;
      border-radius: 18px;
      display: inline-block;
      border: 1px solid #124453;
      box-shadow: 0 8px 24px rgba(18, 68, 83, 0.04);
      margin-bottom: 14px;
    }

    .qr-image {
      width: 58mm;
      height: 58mm;
      display: block;
    }

    .scan-instruction {
      font-family: Montserrat, sans-serif;
      font-size: 11.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: #124453;
      display: block;
    }

    .poster-footer {
      text-align: center;
      width: 100%;
      border-top: 1px solid #E5E5EA;
      padding-top: 16px;
      position: relative;
      z-index: 1;
    }

    .footer-text {
      font-family: Montserrat, sans-serif;
      font-size: 11px;
      color: #8E8E93;
      font-weight: 500;
      letter-spacing: 0.02em;
      margin: 0;
    }

    @media print {
      body {
        background: #FFFFFF;
        display: block;
        min-height: auto;
      }
      .poster-wrapper {
        box-shadow: none;
        margin: 0;
      }
    }
  </style>
</head>
<body>
  <div class="poster-wrapper">
    <svg class="watermark" viewBox="0 0 240 80" aria-hidden="true" focusable="false">
      <path fill="currentColor" d="M18 48c18-2 34-10 52-12 16-2 30 2 44 6 12 4 26 8 40 6 18-2 34-12 52-14v8c-16 4-30 12-46 14-16 2-30-2-44-6-14-4-28-8-44-6-14 2-28 8-42 12l-12-8zm8 10h188c2 0 4 2 4 4s-2 4-4 4H26c-2 0-4-2-4-4s2-4 4-4zm96-36c2-8 8-14 16-16 6-2 12 2 14 8 2 4 0 10-4 12-6 4-14 2-18-2-4-4-6-6-8-2z"/>
    </svg>

    <div class="brand-section">
      <h1 class="hotel-title">Hotel Canal</h1>
      <p class="hotel-subtitle">Santa Croce 553 · Venezia</p>
    </div>

    <div class="cta-section">
      <h2 class="main-claim">Fast Check-in &amp;<br>Welcome Privilege</h2>
      <p class="sub-claim">
        Inquadra il codice per attivare all'istante i servizi digitali della tua camera
        e sbloccare l'esclusivo voucher di benvenuto per la tua esperienza a Venezia.
      </p>
    </div>

    <div class="qr-display-box">
      <div class="qr-plate">
        <img class="qr-image" src="./qr.png" alt="QR Fast Check-in Hotel Canal" width="220" height="220">
      </div>
      <span class="scan-instruction">Scan with your smartphone</span>
    </div>

    <div class="poster-footer">
      <p class="footer-text">Partner · Trattoria alla Terrazza</p>
    </div>
  </div>
</body>
</html>
