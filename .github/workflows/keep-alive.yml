# Mantiene sveglio il servizio Render free (sleep ~15 min senza traffico)
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        env:
          # Imposta vars.PUBLIC_URL su GitHub (es. https://checkin-hotelcanal.it)
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
        run: |
          set -euo pipefail
          BASE="${PUBLIC_URL:-https://checkin-hotelcanal.it}"
          URL="${BASE%/}/health"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /dev/null -w "%{http_code}" "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          exit 1
