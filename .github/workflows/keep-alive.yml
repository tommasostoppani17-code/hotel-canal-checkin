# Mantiene sveglio il servizio Render free (sleep ~15 min senza traffico)
name: Keep alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health
        run: |
          set -euo pipefail
          URL="https://hotel-canal-checkin.onrender.com/health"
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/health.json -w "%{http_code}" "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            head -c 200 /tmp/health.json; echo
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          exit 1
