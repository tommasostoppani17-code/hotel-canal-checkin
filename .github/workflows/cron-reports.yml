# Report automatici (alternativa gratuita ai Cron Job Render a pagamento)
name: Hotel Canal reports

on:
  schedule:
    # 00:00 Europe/Rome ≈ 22:00 UTC (ora legale)
    - cron: "0 22 * * *"
    # 1° del mese ~00:05 Europe/Rome ≈ 22:05 UTC del giorno 1 (CEST)
    - cron: "5 22 1 * *"
  workflow_dispatch:
    inputs:
      kind:
        description: daily o monthly
        required: true
        default: daily
        type: choice
        options:
          - daily
          - monthly

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call report endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          # Imposta vars.PUBLIC_URL su GitHub (es. https://checkin-hotelcanal.it)
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          EVENT_NAME: ${{ github.event_name }}
          INPUT_KIND: ${{ inputs.kind }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "Missing secret CRON_SECRET"
            exit 1
          fi
          KIND="daily"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            KIND="$INPUT_KIND"
          elif [ "$SCHEDULE" = "5 22 1 * *" ]; then
            KIND="monthly"
          fi
          if [ "$KIND" = "monthly" ]; then
            PATH_API="/api/cron/monthly-staff-report"
            # Manuale: consente invio anche fuori dal 1°
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              PATH_API="${PATH_API}?force=1"
            fi
          else
            PATH_API="/api/cron/daily-report"
          fi
          BASE="${PUBLIC_URL:-https://checkin-hotelcanal.it}"
          URL="${BASE%/}${PATH_API}"
          echo "POST $URL (kind=$KIND)"
          # Free tier può essere in sleep: ritenta
          for i in 1 2 3 4 5; do
            code=$(curl -sS -o /tmp/cron-body.txt -w "%{http_code}" -X POST "$URL" \
              -H "Authorization: Bearer ${CRON_SECRET}" \
              -H "Content-Type: application/json" || echo "000")
          echo "attempt $i -> HTTP $code"
          # Non loggare il body (può contenere metadati report)
          if [ "$code" = "200" ] || [ "$code" = "204" ]; then
            exit 0
          fi
            sleep 20
          done
          exit 1
