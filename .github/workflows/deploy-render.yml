# Auto-deploy hotel-canal-checkin on every push to main (Render API).
# Secret: RENDER_API_KEY (Render Account → API Keys, or CLI token).

name: Deploy Render

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy (API)
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-d9rruo0n74is73ff1ui0
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY:-}" ]; then
            echo "Missing secret RENDER_API_KEY"
            exit 1
          fi
          code=$(curl -sS -o /tmp/deploy.json -w '%{http_code}' \
            -X POST "https://api.render.com/v1/services/${SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            -d '{"clearCache":"do_not_clear"}')
          echo "HTTP ${code}"
          cat /tmp/deploy.json
          echo
          case "$code" in
            200|201|202) ;;
            *) exit 1 ;;
          esac
