# Hotel Canal Check-in — Blueprint Render (production)
# Starter + disk richiede carta su Render. Finché free: Gist backup + keep-alive.
# Upgrade: Dashboard → plan Starter → attach disk → DATABASE_PATH=/var/data/checkins.db
services:
  - type: web
    name: hotel-canal-checkin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    # Dopo upgrade a starter (carta su Render), decommenta e cambia DATABASE_PATH:
    # disk:
    #   name: checkins-data
    #   mountPath: /var/data
    #   sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: HOTEL_NAME
        value: Hotel Canal
      - key: CRON_TZ
        value: Europe/Rome
      - key: DATABASE_PATH
        value: ./data/checkins.db
      - key: PUBLIC_URL
        sync: false
      - key: REPORT_EMAIL
        sync: false
      - key: TABLE_BOOKING_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GUEST_ACCESS_SECRET
        sync: false
      - key: COUPON_SECRET
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: REPORT_TRIGGER_TOKEN
        sync: false
      - key: WIFI_SSID
        sync: false
      - key: WIFI_PASSWORD
        sync: false
      - key: WIFI_TYPE
        value: WPA
      - key: DOOR_CODE_WALTER
        sync: false
      - key: DOOR_CODE_AIRONE
        sync: false
      - key: CHECKIN_BACKUP_GIST_ID
        sync: false
      - key: CHECKIN_BACKUP_GITHUB_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: WHATSAPP_PAYEL
        sync: false

  # Report notturno: .github/workflows/cron-reports.yml
