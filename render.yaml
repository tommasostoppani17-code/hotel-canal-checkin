# Keep Render free awake + blueprint for paid persistence
services:
  - type: web
    name: hotel-canal-checkin
    runtime: node
    # starter = sempre acceso + disco persistente (richiede carta su Render)
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: checkins-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOTEL_NAME
        value: Hotel Canal
      - key: CRON_TZ
        value: Europe/Rome
      - key: DATABASE_PATH
        value: /var/data/checkins.db
      - key: PUBLIC_URL
        sync: false
      - key: REPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: WIFI_SSID
        sync: false
      - key: WIFI_PASSWORD
        sync: false
      - key: WIFI_TYPE
        value: WPA
      - key: DOOR_CODE_WALTER
        sync: false
      - key: DOOR_CODE_AIRONE
        sync: false
      - key: CHECKIN_BACKUP_GIST_ID
        sync: false
      - key: CHECKIN_BACKUP_GITHUB_TOKEN
        sync: false

  # Cron Job Render: piano a pagamento.
  # Report automatici: .github/workflows/cron-reports.yml
  # Keep-alive free tier: .github/workflows/keep-alive.yml
