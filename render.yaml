# Hotel Canal Check-in — Blueprint Render
# https://dashboard.render.com/blueprints

services:
  - type: web
    name: hotel-canal-checkin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOTEL_NAME
        value: Hotel Canal
      - key: CRON_TZ
        value: Europe/Rome
      - key: DATABASE_PATH
        value: ./data/checkins.db
      - key: PUBLIC_URL
        sync: false
      - key: REPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: WIFI_SSID
        sync: false
      - key: WIFI_PASSWORD
        sync: false
      - key: WIFI_TYPE
        value: WPA
      - key: DOOR_CODE_WALTER
        sync: false
      - key: DOOR_CODE_AIRONE
        sync: false

  # 00:00 Europe/Rome ≈ 22:00 UTC (estate) / 23:00 UTC (inverno) — usiamo 22:00 UTC
  - type: cron
    name: hotel-canal-daily-report
    runtime: node
    plan: free
    region: frankfurt
    schedule: "0 22 * * *"
    buildCommand: npm install
    startCommand: node scripts/trigger-cron.mjs daily
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CRON_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: HOST
        fromService:
          name: hotel-canal-checkin
          type: web
          property: host

  # Fine mese 23:59 Rome ≈ 21:59 UTC estate — check ogni sera; il server salta se non è ultimo giorno
  - type: cron
    name: hotel-canal-monthly-report
    runtime: node
    plan: free
    region: frankfurt
    schedule: "59 21 * * *"
    buildCommand: npm install
    startCommand: node scripts/trigger-cron.mjs monthly
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: CRON_SECRET
        sync: false
      - key: PUBLIC_URL
        sync: false
      - key: HOST
        fromService:
          name: hotel-canal-checkin
          type: web
          property: host
