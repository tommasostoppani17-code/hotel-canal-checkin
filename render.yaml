# Hotel Canal Check-in — Blueprint Render (production)
# Requires payment method on Render for Starter + persistent disk.
services:
  - type: web
    name: hotel-canal-checkin
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    disk:
      name: checkins-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: HOTEL_NAME
        value: Hotel Canal
      - key: CRON_TZ
        value: Europe/Rome
      - key: DATABASE_PATH
        value: /var/data/checkins.db
      - key: PUBLIC_URL
        sync: false
      - key: REPORT_EMAIL
        sync: false
      - key: REPORT_EMAIL_OFFICIAL
        value: grandcanalhotels@gmail.com
      - key: REPORT_SEND_TIME
        value: "22:35"
      - key: HOTEL_IBAN
        sync: false
      - key: HOTEL_IBAN_HOLDER
        sync: false
      - key: TABLE_BOOKING_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: GUEST_ACCESS_SECRET
        sync: false
      - key: COUPON_SECRET
        sync: false
      - key: FIELD_ENCRYPTION_KEY
        sync: false
      - key: REPORT_TRIGGER_TOKEN
        sync: false
      - key: WIFI_SSID
        sync: false
      - key: WIFI_PASSWORD
        sync: false
      - key: WIFI_SSID_AIRONE
        sync: false
      - key: WIFI_SSID_APARTMENT
        sync: false
      - key: WIFI_PASSWORD_APARTMENT
        sync: false
      - key: WIFI_TYPE
        value: WPA
      - key: DOOR_CODE_WALTER
        sync: false
      - key: DOOR_CODE_AIRONE
        sync: false
      - key: CHECKIN_BACKUP_GIST_ID
        sync: false
      - key: CHECKIN_BACKUP_GITHUB_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_WHATSAPP_FROM
        sync: false
      - key: WHATSAPP_PAYEL
        sync: false
      - key: ALLOW_PAYEL_WHATSAPP
        sync: false
      - key: STAFF_PIN_TOMMASO
        sync: false
      - key: STAFF_PIN_JOHN
        sync: false
      - key: STAFF_PIN_ALEJANDRO
        sync: false
      - key: STAFF_PIN_MARIA
        sync: false
      - key: STAFF_PIN_MIZAN
        sync: false
      - key: STAFF_PIN_PAYEL
        sync: false
      - key: STAFF_PIN_SAYEED
        sync: false
      - key: TESTER_EMAILS
        sync: false
      - key: TESTER_PHONES
        sync: false

  # Report notturno: .github/workflows/cron-reports.yml
