# Hotel Canal Check-in — Blueprint Render
# https://dashboard.render.com/blueprints

services:
  - type: web
    name: hotel-canal-checkin
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: HOTEL_NAME
        value: Hotel Canal
      - key: CRON_TZ
        value: Europe/Rome
      - key: DATABASE_PATH
        value: ./data/checkins.db
      - key: PUBLIC_URL
        sync: false
      - key: REPORT_EMAIL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: WIFI_SSID
        sync: false
      - key: WIFI_PASSWORD
        sync: false
      - key: WIFI_TYPE
        value: WPA
      - key: DOOR_CODE_WALTER
        sync: false
      - key: DOOR_CODE_AIRONE
        sync: false

  # I Cron Job Render non sono più sul piano free.
  # Report automatici: GitHub Actions → .github/workflows/cron-reports.yml
  # (secret CRON_SECRET + optional var PUBLIC_URL)
